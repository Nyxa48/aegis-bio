[package]
name = "aegis_bio_demo"
version = "0.1.0"
edition = "2021"
default-run = "aegis_bio_demo"

[[bin]]
name = "aegis_bio_demo"
path = "src/main.rs"

[[bin]]
name = "hub_terminal"
path = "src/bin/hub_terminal.rs"

[dependencies]
eframe = "0.27.2"
egui_plot = "0.27.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
