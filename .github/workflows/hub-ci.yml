name: Hub Terminal CI

on:
  push:
    branches:
      - hub-terminal
  workflow_dispatch:

jobs:
  test-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies and run tests
        run: |
          uv sync
          uv run pytest -v
