[package]
name = "hub-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "hub_desktop"
crate-type = ["rlib"]

[[bin]]
name = "hub-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = "0.37"
egui = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
