[project]
name = "aegis-bio-hub"
version = "0.1.0"
description = "AEGIS-BIO Mission Hub Terminal (FastAPI + SQLite + Dual-Scope Cockpit)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
